name: Android CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Android API 35
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Validate and regenerate offline questions
        run: |
          python3 scripts/validate_questions.py
          python3 scripts/generate_database.py
      - name: Tests, lint and debug APK
        run: ./gradlew --no-daemon :core:test :app:verifyPaparazziDebug :app:lintDebug :app:assembleDebug
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-checks
          path: |
            core/build/reports/tests
            app/build/reports
            app/build/outputs/apk/debug/*.apk
