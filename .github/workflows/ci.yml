name: Android CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v5
      - name: Android API 35
        run: bash scripts/ci_android.sh
      - name: Validate and regenerate offline questions
        run: |
          python3 scripts/validate_questions.py
          python3 scripts/generate_database.py
      - name: Tests, lint and debug APK
        run: ./gradlew --no-daemon :core:test :app:verifyPaparazziDebug :app:lintDebug :app:assembleDebug
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: android-checks
          path: |
            core/build/reports/tests
            app/build/reports
            app/build/outputs/apk/debug/*.apk
