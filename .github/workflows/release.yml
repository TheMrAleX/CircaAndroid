name: Signed ARM64 release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v5
      - name: Check version and prepare data
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          grep -F "versionName = \"$VERSION\"" app/build.gradle.kts
          printf 'VERSION=%s\n' "$VERSION" >> "$GITHUB_ENV"
          bash scripts/ci_android.sh
          python3 scripts/validate_questions.py
          python3 scripts/generate_database.py
      - name: Prepare signing key
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          KEYSTORE_PATH="$RUNNER_TEMP/release.jks"
          if [[ -n "$KEYSTORE_BASE64" ]]; then
            test -n "$KEYSTORE_PASSWORD" && test -n "$KEY_ALIAS" && test -n "$KEY_PASSWORD"
            printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          else
            KEYSTORE_PASSWORD="$(openssl rand -hex 24)"
            KEY_PASSWORD="$KEYSTORE_PASSWORD"
            KEY_ALIAS="aproximado"
            echo "::add-mask::$KEYSTORE_PASSWORD"
            keytool -genkeypair -noprompt -keystore "$KEYSTORE_PATH" -storetype JKS -alias "$KEY_ALIAS" -storepass "$KEYSTORE_PASSWORD" -keypass "$KEY_PASSWORD" -keyalg RSA -keysize 3072 -validity 10000 -dname 'CN=Aproximado, O=Offline Games, C=ES'
            echo 'Se usa una firma temporal. Configura secrets estables para conservar compatibilidad entre versiones.' >> "$GITHUB_STEP_SUMMARY"
          fi
          chmod 600 "$KEYSTORE_PATH"
          printf 'KEYSTORE_PATH=%s\nKEYSTORE_PASSWORD=%s\nKEY_ALIAS=%s\nKEY_PASSWORD=%s\n' "$KEYSTORE_PATH" "$KEYSTORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" >> "$GITHUB_ENV"
      - name: Verify and build signed release
        run: ./gradlew --no-daemon :core:test :app:testDebugUnitTest :app:lintRelease :app:assembleRelease
      - name: Verify APK and checksum
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          APK="Aproximado-v${VERSION}-arm64-v8a.apk"
          cp app/build/outputs/apk/release/app-release.apk "dist/$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "dist/$APK"
          (cd dist && sha256sum "$APK" > "$APK.sha256")
          printf '\nAPK firmado para Android 8 o posterior. Juego completamente offline.\n\nSHA256:\n```\n' > dist/notes.md
          cat "dist/$APK.sha256" >> dist/notes.md
          printf '```\n' >> dist/notes.md
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.apk dist/*.sha256 --verify-tag --title "Aproximado $GITHUB_REF_NAME" --generate-notes --notes-file dist/notes.md
      - name: Remove key
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
